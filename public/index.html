<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border-radius: 8px; border: 1px solid #51667c; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 10px 14px; border-radius: 8px; border: 0; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    #auth-state { margin: 0 0 12px; font-weight: 700; color: #ecf4ff; }
    #auth-error { margin: 10px 0 0; color: #ffb3c0; font-size: 15px; min-height: 1.2em; }
    [hidden] { display: none !important; }
    #note-form { display: grid; gap: 10px; margin: 0 0 18px; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    #note-form label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    #note-form input, #note-form textarea { padding: 10px 12px; border-radius: 8px; border: 1px solid #51667c; background: #101a28; color: #ecf4ff; font: inherit; font-size: 16px; }
    #note-form textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row button, li .row button { padding: 8px 12px; border-radius: 8px; border: 0; background: #8ad8df; color: #101a28; font-size: 15px; font-weight: 700; cursor: pointer; }
    .row button.secondary { background: #51667c; color: #ecf4ff; }
    .row button:disabled { opacity: .6; cursor: wait; }
    li .row { margin-top: 10px; }
    #note-error { margin: 0; color: #ffb3c0; font-size: 15px; min-height: 1.2em; }
    .hint { margin: 0; font-size: 14px; color: #8fa6bf; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 내 자료만 보이게</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인하지 않으면 자료가 보이지 않습니다. 로그인하면 내 메모만 보고 고칠 수 있고, 다른 사람의 메모에는 접근할 수 없습니다.</div>
    <section class="auth" aria-label="로그인">
      <p id="auth-state" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일<input id="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" id="login-button">로그인</button>
      </form>
      <button type="button" id="logout-button" hidden>로그아웃</button>
      <p id="auth-error" role="alert"></p>
    </section>
    <form id="note-form" hidden>
      <strong id="note-form-title">새 메모</strong>
      <label>제목<input id="note-title" maxlength="200" required></label>
      <label>내용<textarea id="note-body" maxlength="5000" required></textarea></label>
      <p class="hint">가상 메모만 적으세요. 실명·실제 개인정보·비밀번호는 넣지 않습니다.</p>
      <div class="row">
        <button type="submit" id="note-submit">추가</button>
        <button type="button" id="note-cancel" class="secondary" hidden>수정 취소</button>
      </div>
      <p id="note-error" role="alert"></p>
    </form>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 로그인용 공개 설정(Project URL, publishable key)은 화면 코드에 적지 않고 서버 함수 /api/config에서 받습니다.
    // secret/service_role 키는 어디에도 넣지 않습니다.

    const stateText = document.querySelector('#auth-state');
    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const errorText = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    const noteForm = document.querySelector('#note-form');
    const noteFormTitle = document.querySelector('#note-form-title');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSubmit = document.querySelector('#note-submit');
    const noteCancel = document.querySelector('#note-cancel');
    const noteError = document.querySelector('#note-error');

    let currentSession = null;
    let editingId = null;
    let loadId = 0;

    // SDK를 못 불러와도(오프라인·차단) 화면이 멈추지 않도록 따로 감쌉니다.
    let supabase = null;
    try {
      const configResponse = await fetch('/api/config', { headers: { Accept: 'application/json' } });
      if (!configResponse.ok) throw new Error('config');
      const { supabaseUrl, publishableKey } = await configResponse.json();
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
      supabase = createClient(supabaseUrl, publishableKey);
    } catch {
      stateText.textContent = '로그인 모듈을 불러오지 못했습니다.';
      errorText.textContent = '로그인 설정(/api/config)이나 로그인 SDK(cdn.jsdelivr.net)를 읽지 못했습니다. 인터넷 연결·차단 설정·Vercel 환경변수를 확인하고 새로고침하세요.';
    }

    function showSession(session) {
      currentSession = session ?? null;
      const user = session?.user;
      form.hidden = Boolean(user);
      logoutButton.hidden = !user;
      noteForm.hidden = !user;
      if (!user) resetNoteForm();
      stateText.textContent = user
        ? `로그인됨: ${user.email ?? '이메일 없음'}`
        : '로그인하지 않은 상태입니다.';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!supabase) return;
      errorText.textContent = '';
      loginButton.disabled = true;
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });
        if (error) errorText.textContent = `로그인 실패: ${error.message}`;
      } catch {
        errorText.textContent = '로그인 실패: 네트워크 오류로 요청을 보내지 못했습니다.';
      } finally {
        passwordInput.value = '';
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      if (!supabase) return;
      errorText.textContent = '';
      logoutButton.disabled = true;
      try {
        const { error } = await supabase.auth.signOut();
        if (error) errorText.textContent = `로그아웃 실패: ${error.message}`;
      } catch {
        errorText.textContent = '로그아웃 실패: 네트워크 오류로 요청을 보내지 못했습니다.';
      } finally {
        logoutButton.disabled = false;
      }
    });

    const showNotice = text => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };

    // 로그인 토큰(access_token)만 Authorization 헤더로 보냅니다. 판정은 서버 함수가 합니다.
    async function api(method, path, payload) {
      if (!currentSession?.access_token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method,
        cache: 'no-store',
        headers: {
          Authorization: `Bearer ${currentSession.access_token}`,
          ...(payload ? { 'Content-Type': 'application/json' } : {}),
        },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인하세요.');
      if (!response.ok) {
        let reason = '';
        try { reason = (await response.json()).error ?? ''; } catch { /* 본문 없음 */ }
        throw new Error(`요청이 거부되었습니다 (HTTP ${response.status}${reason ? ` ${reason}` : ''})`);
      }
      return response.status === 204 ? null : response.json();
    }

    function resetNoteForm() {
      editingId = null;
      noteTitle.value = '';
      noteBody.value = '';
      noteFormTitle.textContent = '새 메모';
      noteSubmit.textContent = '추가';
      noteCancel.hidden = true;
    }

    function startEdit(note) {
      editingId = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body;
      noteFormTitle.textContent = '메모 수정';
      noteSubmit.textContent = '수정 저장';
      noteCancel.hidden = false;
      noteError.textContent = '';
      noteTitle.focus();
    }

    function renderNote(note) {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const content = document.createElement('span');
      const row = document.createElement('div');
      const edit = document.createElement('button');
      const remove = document.createElement('button');
      title.textContent = note.title;
      content.textContent = note.body;
      row.className = 'row';
      edit.type = 'button';
      edit.textContent = '수정';
      edit.addEventListener('click', () => startEdit(note));
      remove.type = 'button';
      remove.className = 'secondary';
      remove.textContent = '삭제';
      remove.addEventListener('click', async () => {
        if (!confirm('이 메모를 삭제할까요?')) return;
        noteError.textContent = '';
        remove.disabled = true;
        try {
          await api('DELETE', `/api/notes/${note.id}`);
          if (editingId === note.id) resetNoteForm();
          await loadNotes();
        } catch (error) {
          noteError.textContent = `삭제 실패: ${error.message}`;
          remove.disabled = false;
        }
      });
      row.append(edit, remove);
      item.append(title, content, row);
      return item;
    }

    async function loadNotes() {
      const mine = ++loadId;
      if (!currentSession?.access_token) {
        showNotice('로그인하면 자료를 볼 수 있습니다.');
        return;
      }
      try {
        const notes = await api('GET', '/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (mine !== loadId) return;
        if (!notes.length) showNotice('아직 내 메모가 없습니다. 위에서 추가하세요.');
        else list.replaceChildren(...notes.map(renderNote));
      } catch (error) {
        if (mine === loadId) showNotice(error.message.startsWith('요청이') ? '자료를 읽을 수 없습니다.' : error.message);
      }
    }

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      noteError.textContent = '';
      noteSubmit.disabled = true;
      const payload = { title: noteTitle.value.trim(), body: noteBody.value };
      try {
        if (editingId) await api('PUT', `/api/notes/${editingId}`, payload);
        else await api('POST', '/api/notes', payload);
        resetNoteForm();
        await loadNotes();
      } catch (error) {
        noteError.textContent = `${editingId ? '수정' : '추가'} 실패: ${error.message}`;
      } finally {
        noteSubmit.disabled = false;
      }
    });
    noteCancel.addEventListener('click', () => { noteError.textContent = ''; resetNoteForm(); });

    if (supabase) {
      supabase.auth.onAuthStateChange((_event, session) => {
        showSession(session);
        loadNotes();
      });
      try {
        const { data } = await supabase.auth.getSession();
        showSession(data.session);
      } catch {
        showSession(null);
      }
    } else {
      showSession(null);
    }
    loadNotes();
  </script>
</body>
</html>
