<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 인터넷에 연결되어 있지 않습니다</h1>
    <p>자료실의 메모는 이 기기에 저장해 두지 않아서 오프라인에서는 볼 수 없습니다. 연결을 확인한 뒤 다시 열어 주세요.</p>
    <p>연결된 뒤에는 서버가 요청마다 허용 여부를 정합니다.</p>
  </main>
</body>
</html>
